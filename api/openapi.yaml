openapi: 3.0.3
info:
  title: Transaction Ingest API
  version: 1.0.0
  description: Inbound ingest contract for a billable tolling transaction.
paths:
  /ingest/v1/transactions:
    post:
      operationId: ingestTransaction
      summary: Ingest a billable transaction (producer; idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        '201':
          description: Transaction created
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } }
        '200':
          description: Duplicate of an already-ingested transaction
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } }
        '400':
          description: Invalid request or conflicting idempotency key
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /healthz:
    get:
      operationId: health
      responses: {'200': {description: Process is alive}, '405': {description: Method not allowed}}
  /readyz:
    get:
      operationId: readiness
      responses: {'200': {description: Process is ready}, '405': {description: Method not allowed}, '503': {description: Process is not ready}}
  /metrics:
    get:
      operationId: metrics
      responses: {'200': {description: Prometheus text exposition}, '405': {description: Method not allowed}}
components:
  schemas:
    IngestRequest:
      type: object
      additionalProperties: false
      required: [source, source_reference, transaction_type, transaction_time_utc, base_amount]
      properties:
        source: {type: string, minLength: 1, maxLength: 64}
        source_reference: {type: string, minLength: 1, maxLength: 128}
        transaction_type: {type: string}
        transaction_time_utc: {type: string, format: date-time}
        plate: {$ref: '#/components/schemas/PlateRef'}
        transponder_number: {type: string, nullable: true, maxLength: 64}
        base_amount: {type: string}
        currency: {type: string, nullable: true, maxLength: 8}
        location: {$ref: '#/components/schemas/Location'}
        metadata: {type: object, additionalProperties: true}
    PlateRef:
      type: object
      required: [number, jurisdiction]
      properties:
        number: {type: string, minLength: 1, maxLength: 16}
        jurisdiction: {type: string, minLength: 1, maxLength: 8}
    Location: {type: object, additionalProperties: true}
    IngestResult:
      type: object
      required: [id, association_status, settlement_status, duplicate]
      properties:
        id: {type: string}
        association_status: {type: string, enum: [received, resolving, associated, exception]}
        settlement_status: {type: string, enum: [unpriced, priced, payable, paid]}
        duplicate: {type: boolean}
    Error:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        fields: {type: string}
