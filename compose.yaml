name: emovis-transaction-intake

services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [transaction-intake]

  topic-bootstrap:
    build:
      context: .
      target: topic-bootstrap
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transaction.review-candidates.v1
      KAFKA_TOPIC_PARTITIONS: "3"
      KAFKA_TOPIC_REPLICATION: "1"
      KAFKA_TOPIC_RETENTION: 168h
    depends_on:
      kafka:
        condition: service_healthy
    networks: [transaction-intake]
    restart: "no"

  app:
    build:
      context: .
      target: local
    environment:
      HTTP_ADDRESS: :8080
      PARTNER_ID: local-partner
      API_KEY: local-development-only-key
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transaction.review-candidates.v1
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      topic-bootstrap:
        condition: service_completed_successfully
    networks: [transaction-intake]

networks:
  transaction-intake:
    name: emovis-transaction-intake
