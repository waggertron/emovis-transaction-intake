apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: transaction-intake-worker, namespace: transaction-intake}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: transaction-intake-worker}
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
