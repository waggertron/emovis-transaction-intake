apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: transaction-intake-api, namespace: transaction-intake}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: transaction-intake-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: transaction-intake-worker, namespace: transaction-intake}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: transaction-intake-worker}
